      x-phi: true
      parameters:
      - name: status
        in: query
        required: false
        description: Filter by status.
        schema: {$ref: '#/components/schemas/ClientStatus'}
      - {$ref: '#/components/parameters/LocationIdQuery'}
      - name: serviceLineCode
        in: query
        required: false
        description: Filter by service line.
        schema: {$ref: '#/components/schemas/ServiceLineCode'}
      - name: clientNumber
        in: query
        required: false
        description: Exact agency client number (an opaque identifier).
        schema:
          type: string
          pattern: ^C-[0-9]{4,8}$
        example: C-10234
      - name: sort
        in: query
        required: false
        description: Sort order.
        schema:
          type: string
          enum: [lastName, -lastName, clientNumber, -clientNumber]
          default: lastName
      - {$ref: '#/components/parameters/Cursor'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Clients.
          headers:
