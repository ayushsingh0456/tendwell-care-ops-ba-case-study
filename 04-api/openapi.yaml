    ReportCode:
      type: string
      description: Standard reports (FR-RPT-02).
      enum:
      - EVV_COMPLIANCE
      - VISIT_HISTORY
      - CAREGIVER_HOURS
      - AUTHORIZATION_UTILIZATION
      - MAR_COMPLIANCE
      - INCIDENT_LOG
      - AR_AGEING
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 256
        clientType:
          type: string
          enum: [Web, Mobile, Console]
          default: Web
        deviceId:
          type: [string, 'null']
          description: Registered device ID for mobile sign-in.
    SessionUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: [string, 'null']
          format: uuid
        firstName:
          type: string
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleCode'}
        locationIds:
          type: array
          items:
            type: string
            format: uuid
        mfaEnabled:
          type: boolean
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken]
      properties:
        accessToken:
          type: string
          description: JWT access token.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until the access token expires (900).
        refreshToken:
          type: string
          description: Opaque, rotating refresh token. Each use returns a new one.
        refreshExpiresIn:
          type: integer
          description: Seconds until the refresh token expires (12 h for mobile, 8 h for web).
        user: {$ref: '#/components/schemas/SessionUser'}
    MfaChallenge:
      type: object
      required: [mfaToken, methods, expiresIn]
      properties:
        mfaToken:
          type: string
          description: Short-lived challenge token for POST /auth/mfa/verify.
        methods:
          type: array
          items:
            type: string
            enum: [Totp, Sms]
        smsDestinationMasked:
          type: [string, 'null']
        expiresIn:
          type: integer
    LoginResponse:
      type: object
      required: [result]
      description: Either tokens (no second factor required) or an MFA challenge (BR-006).
      properties:
        result:
          type: string
          enum: [Authenticated, MfaRequired]
        tokens: {$ref: '#/components/schemas/TokenResponse'}
        mfa: {$ref: '#/components/schemas/MfaChallenge'}
    MfaVerifyRequest:
      type: object
      required: [mfaToken, method, code]
      properties:
        mfaToken:
          type: string
        method:
          type: string
          enum: [Totp, Sms]
        code:
          type: string
          pattern: ^[0-9]{6}$
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
        allSessions:
          type: boolean
          default: false
          description: Revoke every session of the user.
    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    PasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: Single-use token from the reset link (valid 30 minutes).
        newPassword:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 256
          description: At least 12 characters; checked against a breached-password list (BR-007).
    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        pricePerSeatCents:
          type: integer
          description: Monthly price per active client seat (BR-002).
        status: {$ref: '#/components/schemas/PlanStatus'}
