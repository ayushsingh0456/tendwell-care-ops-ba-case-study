  /evv/punches/sync:
    post:
      tags: [EVV]
      operationId: syncOfflinePunches
      summary: Sync a batch of offline punches
      description: |
        Uploads punches captured without connectivity (up to 72 hours of punches, at most 200 per batch). The app stores
        punches encrypted and sends them in capture order when connectivity returns.

        * **Idempotency per item.** Each punch carries a client-generated `punchId` (UUID). A punch already received returns
          `Duplicate` with its original receipt time, so a batch whose response was lost can be resent safely. The batch
          needs no Idempotency-Key.
        * **Times.** `deviceCapturedAt` is kept as the punch time and the server receipt time is stored separately. A punch
          received more than 24 hours after capture raises `LATE_OFFLINE_SYNC`.
        * **Checks.** Distance, accuracy and timing exceptions are computed exactly as for online punches (`source = MobileOffline`).
        * **Per-item results.** The response is `200` even when some items fail. Each item is `Accepted`, `Duplicate` or
          `Rejected` with a problem. Rejected items stay on the device and are shown to the caregiver; the Coordinator
          records the time through a time correction.
        * An item with `visitId: null` and a `clientId` creates an unscheduled visit and raises `UNSCHEDULED_VISIT`.

        Requirements: FR-EVV-05, FR-EVV-02, FR-EVV-03, FR-EVV-07. Business rules: BR-003, BR-021, BR-022, BR-023, BR-025. Change requests: CR-004. Non-functional: NFR-AVL-02, NFR-MOB-02.
      x-requirements: [FR-EVV-05, FR-EVV-02, FR-EVV-03, FR-EVV-07]
      x-business-rules: [BR-003, BR-021, BR-022, BR-023, BR-025]
      x-change-requests: [CR-004]
      x-permission: evv:sync
      x-roles: [CG]
      x-phi: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncRequest'}
            example:
              deviceId: and-5f2c9e81b7a4
              appVersion: 1.6.2
              batchId: 5d6e7f80-91a2-4b3c-8d4e-5f6a7b8c9d10
