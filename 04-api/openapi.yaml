        schema:
          type: string
          format: date
        example: '2026-09-01'
      - name: to
        in: query
        required: true
        description: End date (tenant time), inclusive.
        schema:
          type: string
          format: date
        example: '2026-09-30'
      - {$ref: '#/components/parameters/LocationIdQuery'}
      - name: payerId
        in: query
