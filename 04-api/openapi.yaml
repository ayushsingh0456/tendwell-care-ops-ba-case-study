  /visits/{visitId}/clock-in:
    post:
      tags: [EVV]
      operationId: clockIn
      summary: Clock in to a visit
      description: |
        Records a clock-in punch for the caller's assigned visit, from 15 minutes before the scheduled start until the
        scheduled end. The server stores the device time and the server receipt time, computes the distance to the
        service address (the device cannot send it) and stamps the active care plan version on the visit.

        Exceptions never block the punch:
        * accuracy worse than 100 m or coordinates (0,0): `LOW_GPS_ACCURACY` (CR-004), and no location decision is made;
        * otherwise distance greater than the client's geofence radius: `LOCATION_MISMATCH`;
        * clock-in more than 10 minutes after the scheduled start: `LATE_START`.

        `punchId` is generated by the app and makes the call idempotent: a retry with the same `punchId` returns the original
        result with `200`. Clock-in remains available when the tenant is `ReadOnly`, so care is never blocked.

        Requirements: FR-EVV-01, FR-EVV-02, FR-EVV-03, FR-EVV-04, FR-EVV-07. Business rules: BR-003, BR-012, BR-020, BR-021, BR-022, BR-023, BR-024. Change requests: CR-004. Non-functional: NFR-PERF-02, NFR-USE-01.
