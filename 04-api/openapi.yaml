  /webhooks/payments:
    post:
      tags: [Billing]
      operationId: receivePaymentWebhook
      summary: Receive payment-provider events (signature-verified)
      description: |
        Inbound endpoint for the payment provider. No bearer token: the `Stripe-Signature` header is verified (HMAC-SHA256
        over `<timestamp>.<raw body>`, constant-time compare, 5-minute timestamp tolerance) before the body is parsed.

        * Events are processed idempotently by event `id`. A replay returns `200` with `duplicate: true` and changes nothing.
        * Order is not assumed. State changes are monotonic, and the current object is re-read from the provider before an
          older event could move an invoice backwards.
        * Invoice payment events update `payments` and the invoice balance and status.
        * Subscription payment failures drive retries; the third failure starts the 7-day path to `ReadOnly`, and a later
          success returns the tenant to `Active`.

        Respond fast: the endpoint stores the event and returns `200`; processing is asynchronous.

        Requirements: FR-BIL-05, FR-ONB-06, FR-ONB-07. Business rules: BR-003, BR-052.
      x-requirements: [FR-BIL-05, FR-ONB-06, FR-ONB-07]
      x-business-rules: [BR-003, BR-052]
      x-permission: webhooks:receive_payments
      x-roles: [SYS]
      security:
      - webhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentWebhookEvent'}
            example:
              id: evt_3PzX7aLakemont9Q
              type: payment_intent.succeeded
              created: 1790959509
              livemode: true
              account: acct_1LakemontHVHC01
              data:
                object:
                  id: pi_3PzX7aLakemont9
                  object: payment_intent
                  amount: 31175
                  currency: usd
                  status: succeeded
                  metadata:
                    tenantId: 7c1e4a52-3b9d-4f0e-9a61-2d8f5b3c1a01
                    invoiceId: b4e2d6f8-1a3c-4e5b-9d7f-000000000456
                    invoiceNumber: INV-2026-000456
      responses:
        '200':
          description: Event accepted (or already processed).
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookAck'}
              example:
                received: true
                duplicate: false
        '400':
          description: Malformed request.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tendwell.example/problems/BIL_WEBHOOK_SIGNATURE_INVALID
                title: Signature verification failed
                status: 400
                detail: The signature does not match or the timestamp is outside the 5-minute tolerance.
                instance: /v1/webhooks/payments
                code: BIL_WEBHOOK_SIGNATURE_INVALID
                requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
        '429': {$ref: '#/components/responses/TooManyRequests'}
