      description: |
        Records Given, Refused, Held, Not available or Self-administered (with supervision) with the time. Refused, Held and
        Not available need a reason. After the window closes the dose is `Overdue`; 60 minutes later it becomes
        `MissedUndocumented` and the Clinical Supervisor is alerted. A late entry is accepted up to 24 hours after the
        scheduled time and is labelled Late entry; after that only a Clinical Supervisor can annotate the dose. A second
        consecutive Refused or Held outcome for the same order alerts the Clinical Supervisor.

        Requirements: FR-MAR-03, FR-MAR-04, FR-MAR-06. Business rules: BR-029, BR-030, BR-031, BR-032. Change requests: CR-007.
