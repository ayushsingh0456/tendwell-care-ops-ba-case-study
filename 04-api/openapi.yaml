  /billing-runs:
    post:
      tags: [Billing]
      operationId: createBillingRun
      summary: Start a billing run (Idempotency-Key required)
      description: |
        Starts billing for a period. The run prices Verified visits only, using the matching authorization's billing model
        (Hourly 15-minute units, Per visit, Daily or Fixed monthly), caps units at the remaining authorization and creates
        one Draft invoice per client per payer.

        Idempotency works at two levels:
        * the `Idempotency-Key` header makes a retried request return the same run;
        * each invoice's database-unique key (tenant + client + payer + period) means re-running a period updates existing
          Draft invoices and never creates a second invoice (CR-005, after INC-2026-007). Approved or issued invoices are skipped.

        Runs are single-flight per tenant and period. The run completes asynchronously; watch `billing_run.completed` or
        list invoices by `billingRunId`.

        Requirements: FR-BIL-01, FR-BIL-02, FR-BIL-03. Business rules: BR-028, BR-047, BR-048, BR-049, BR-050. Change requests: CR-005. Non-functional: NFR-PERF-04, NFR-OBS-02.
      x-requirements: [FR-BIL-01, FR-BIL-02, FR-BIL-03]
      x-business-rules: [BR-028, BR-047, BR-048, BR-049, BR-050]
      x-change-requests: [CR-005]
      x-permission: billing_runs:create
      x-roles: [AG-FIN]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyRequired'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingRunCreate'}
            example:
              periodStart: '2026-09-01'
              periodEnd: '2026-09-30'
      responses:
        '202':
          description: Run accepted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/Idempotent-Replayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BillingRun'}
              example:
                id: d7c9e1f3-5a7b-4c9d-8e1f-202609300001
                periodStart: '2026-09-01'
                periodEnd: '2026-09-30'
                status: Running
                startedBy: d9e0f1a2-b3c4-4d5e-8f6a-7b8c9d0e1f01
                startedAt: '2026-10-01T13:00:00Z'
                completedAt: null
                summary: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: State conflict.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tendwell.example/problems/BIL_RUN_IN_PROGRESS
                title: A billing run for this period is already running
