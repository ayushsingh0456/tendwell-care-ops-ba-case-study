      summary: Configure the escalation ladder for an event type
      description: |
        Replaces the steps (delay, recipient role, channels) for an event type. Steps target **roles only**; recipients are
        resolved at send time from active users holding the role in the relevant location, so deactivated users never
        receive escalations (CR-006, after INC-2026-015). Escalation stops when the triggering condition is resolved.
        Deliveries are deduplicated by event, recipient and step.

