# Tendwell API - OpenAPI 3.1 contract (fictional case study)
# Document ID: TW-API-01 | Version 1.3.0 | Owner: Business Analyst | Last updated: 2026-09-24
# Aligned to SRS v1.3. Conventions: api-guidelines.md. Events: events-and-webhooks.md.
# Data model: ../03-design/data/data-dictionary.md
openapi: 3.1.0
info:
  title: Tendwell API
  version: 1.3.0
  summary: Operations API for home and community-based care agencies (fictional case study).
  description: |
    REST API for **Tendwell**, the operations platform for home and community-based care agencies
    (fictional case study). It serves the Agency Web App, the Caregiver Mobile App, the Platform Console and the public
    sign-up site.

    **Conventions** (full rules in [api-guidelines.md](api-guidelines.md)):

    * JSON with camelCase properties. Money is integer cents (`amountCents`). Instants are RFC 3339 in UTC; business
      dates are `YYYY-MM-DD` in the tenant time zone (America/New_York for the samples).
    * Bearer JWT on every operation except auth, sign-up and the payment webhook. The tenant comes from the token,
      never from the URL. Permissions are `resource:action` strings, shown per operation as `x-permission`.
    * Errors are RFC 9457 `application/problem+json` with a stable `code` from the error code catalog.
    * Cursor pagination (`cursor`, `limit`) on collections; `Idempotency-Key` on unsafe POSTs (required where marked);
      `ETag` and `If-Match` for optimistic concurrency.
    * PHI is masked by default, never placed in URLs or query strings, and never logged. Operations that carry PHI are
      marked `x-phi: true`.
    * Traceability extensions: `x-requirements` (FR IDs), `x-business-rules` (BR IDs), `x-change-requests`,
      `x-permission`, `x-roles` (default role templates holding the permission) and `x-release` (R2 only).

    All names, agencies, people, identifiers and data in this document are fictional.
  contact:
    name: Tendwell Labs API team (fictional)
    email: api-team@example.com
    url: https://developer.tendwell.example
  license:
    name: Proprietary (case study)
    identifier: LicenseRef-Proprietary
  x-srs-version: v1.3 (2026-09-24)
servers:
- url: https://api.tendwell.example/v1
  description: Production (US regions only)
- url: https://sandbox.api.tendwell.example/v1
  description: Sandbox with synthetic data only
security:
- bearerAuth: []
tags:
- name: Auth
  description: Sign-in, MFA, token refresh, sign-out and password reset. Public (no bearer token). Module IAM, epic EP-02.
- name: Sign-up and subscription
  description: Public plan list, promo validation and agency sign-up; the tenant subscription. Module ONB, epic EP-01.
- name: Platform
  description: Plans and promo codes managed by the Platform Administrator. Module ONB, epic EP-01.
- name: Users and access
  description: Users, roles, permission overrides, effective permissions and support access grants. Module IAM, epic EP-02.
- name: Clients
  description: Client records, PHI reveal, discharge, service authorizations and care plans. Module CLI, epic EP-03.
- name: Caregivers
  description: Caregiver profiles, deactivation, credentials and pay profiles. Module WRK, epic EP-04.
- name: Scheduling
  description: Visit patterns, visits, compliance checks and open shifts. Module SCH, epic EP-05.
- name: EVV
  description: Identity checks, clock-in and clock-out, offline sync, exceptions and time corrections. Module EVV, epic EP-06.
- name: eMAR and vitals
  description: Medication orders, dose tasks, PRN doses, vitals, vital ranges and the MAR grid. Module MAR, epic EP-07.
- name: Documentation
  description: Visit notes, addenda and client incidents. Module DOC, epic EP-08.
- name: Time off
  description: Time-off requests, impact and decisions, leave balances and holidays. Module TOF, epic EP-09.
- name: Payroll
  description: Pay periods, pay summaries, pre-export review and payroll export. Module PAY, epic EP-10.
- name: Billing
  description: Billing runs, invoices, payment links, credit notes, claim batches and the payment webhook. Module BIL, epic
    EP-11.
- name: Notifications
  description: In-app notifications, personal preferences and escalation ladders. Module NTF, epic EP-12.
- name: Reporting and audit
  description: Operations dashboard, standard reports and the audit log. Module RPT, epic EP-13.
- name: Family portal (Release 2)
  description: Release 2 only (CR-003). Included to fix the contract early. Module FAM, epic EP-14.
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Authenticates a user by email and password. When the user holds an MFA-mandatory role (Agency Administrator,
        Clinical Supervisor, Billing & Payroll Specialist, all platform roles) or has enrolled a second factor,
        the response is an MFA challenge instead of tokens.

        * Unknown email and wrong password return the same `401 IAM_INVALID_CREDENTIALS`, so the response never reveals
          whether an email is registered.
        * After 5 consecutive failures for the same email, the account is locked for 15 minutes and the account owner
          is emailed. Further attempts return `403 IAM_ACCOUNT_LOCKED`. Attempts against unknown emails are counted the same way.
        * Every attempt is recorded in `sign_in_events` with outcome, IP, device and timestamp.

        Requirements: FR-IAM-01, FR-IAM-03, FR-IAM-08. Business rules: BR-006, BR-007.
      x-requirements: [FR-IAM-01, FR-IAM-03, FR-IAM-08]
      x-business-rules: [BR-006, BR-007]
      x-permission: public:anonymous
      x-roles: [AG-ADM, AG-COORD, AG-SUPV, AG-FIN, CG, PLT-ADM, PLT-SUP]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            example:
              email: maya.ortiz@example.com
              password: correct-horse-lakemont-27
              clientType: Mobile
              deviceId: and-5f2c9e81b7a4
      responses:
        '200':
          description: Tokens issued, or MFA challenge required.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              examples:
                authenticated:
                  summary: Caregiver signed in (no MFA required)
                  value:
                    result: Authenticated
                    tokens:
                      accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InR3LTIwMjYtMDkifQ.eyJzdWIiOiI0ZThhOWQ0ZiJ9.c2lnbmF0dXJl
                      tokenType: Bearer
                      expiresIn: 900
                      refreshToken: rt_8Kq2mV9xLakemont3pZ
                      refreshExpiresIn: 43200
                      user:
                        id: 4e8a9d4f-1a37-4b6c-95d3-a20410000001
                        tenantId: 7c1e4a52-3b9d-4f0e-9a61-2d8f5b3c1a01
                        firstName: Maya
                        roles: [CG]
                        locationIds: [1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c01]
                        mfaEnabled: false
                mfaRequired:
                  summary: Agency Administrator must complete MFA (BR-006)
                  value:
                    result: MfaRequired
                    mfa:
                      mfaToken: mfa_Z3x9Lakemont7Qa
                      methods: [Totp, Sms]
                      smsDestinationMasked: +1-***-***-0163
                      expiresIn: 300
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Not authenticated.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tendwell.example/problems/IAM_INVALID_CREDENTIALS
                title: Email or password is incorrect
                status: 401
                detail: Check your email and password and try again. After 5 failed attempts your account is locked for 15
                  minutes.
                instance: /v1/auth/login
                code: IAM_INVALID_CREDENTIALS
                requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
        '403':
          description: Forbidden.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tendwell.example/problems/IAM_ACCOUNT_LOCKED
                title: Account temporarily locked
                status: 403
                detail: Too many failed sign-in attempts. Try again after 15 minutes or reset your password.
                instance: /v1/auth/login
                code: IAM_ACCOUNT_LOCKED
                requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      summary: Complete sign-in with a second factor
      description: |
        Exchanges the MFA challenge token and a 6-digit TOTP or SMS code for tokens. The access token carries
        `amr: ["pwd","mfa"]`. Five wrong codes lock the account for 15 minutes.

        Requirements: FR-IAM-01, FR-IAM-03, FR-IAM-08. Business rules: BR-006.
      x-requirements: [FR-IAM-01, FR-IAM-03, FR-IAM-08]
      x-business-rules: [BR-006]
      x-permission: public:anonymous
      x-roles: [AG-ADM, AG-COORD, AG-SUPV, AG-FIN, PLT-ADM, PLT-SUP]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaVerifyRequest'}
            example:
              mfaToken: mfa_Z3x9Lakemont7Qa
              method: Totp
              code: '482913'
      responses:
        '200':
          description: Tokens issued.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Not authenticated.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                invalid:
                  summary: IAM_MFA_CODE_INVALID
                  value:
                    type: https://api.tendwell.example/problems/IAM_MFA_CODE_INVALID
                    title: The code is not correct
                    status: 401
                    detail: Enter the current 6-digit code from your authenticator app, or request a new SMS code.
                    instance: /v1/auth/mfa/verify
                    code: IAM_MFA_CODE_INVALID
                    requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
                expired:
                  summary: IAM_MFA_CHALLENGE_EXPIRED
                  value:
                    type: https://api.tendwell.example/problems/IAM_MFA_CHALLENGE_EXPIRED
                    title: The sign-in attempt timed out
                    status: 401
                    detail: Sign in again with your email and password to get a new code.
                    instance: /v1/auth/mfa/verify
                    code: IAM_MFA_CHALLENGE_EXPIRED
                    requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
        '403':
          description: Forbidden.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tendwell.example/problems/IAM_ACCOUNT_LOCKED
                title: Account temporarily locked
                status: 403
                detail: Too many incorrect codes. Try again after 15 minutes.
                instance: /v1/auth/mfa/verify
                code: IAM_ACCOUNT_LOCKED
                requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token
      description: |
        Rotates the refresh token. Reuse of an already-rotated refresh token revokes the whole token family
        (theft detection). Mobile refresh tokens stop working 12 hours after the last full authentication; the app then
        asks for device PIN or biometrics and signs in again. Deactivated users and revoked sessions get `401`.

        Requirements: FR-IAM-04, FR-WRK-06.
      x-requirements: [FR-IAM-04, FR-WRK-06]
      x-permission: public:anonymous
      x-roles: [AG-ADM, AG-COORD, AG-SUPV, AG-FIN, CG, PLT-ADM, PLT-SUP]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
            example:
              refreshToken: rt_8Kq2mV9xLakemont3pZ
      responses:
        '200':
          description: New token pair.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: Not authenticated.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: https://api.tendwell.example/problems/IAM_REFRESH_TOKEN_INVALID
                title: Sign-in required
                status: 401
                detail: Your session has ended. Sign in again to continue.
                instance: /v1/auth/refresh
                code: IAM_REFRESH_TOKEN_INVALID
                requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out and revoke the session
      description: |
        Revokes the refresh token and the session it belongs to (or every session of the user when `allSessions` is true).
        Access tokens of revoked sessions are rejected from the next request through the session deny-list.

        Requirements: FR-IAM-04.
      x-requirements: [FR-IAM-04]
      x-permission: public:anonymous
      x-roles: [AG-ADM, AG-COORD, AG-SUPV, AG-FIN, CG, PLT-ADM, PLT-SUP]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogoutRequest'}
            example:
              refreshToken: rt_8Kq2mV9xLakemont3pZ
              allSessions: false
      responses:
        '204':
          description: Signed out.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Request a password reset link
      description: |
        Sends a single-use reset link valid for 30 minutes when the email belongs to an active user. The response is
        always the same `202`, whether or not the email is registered.

        Requirements: FR-IAM-02. Business rules: BR-007.
      x-requirements: [FR-IAM-02]
      x-business-rules: [BR-007]
      x-permission: public:anonymous
      x-roles: [AG-ADM, AG-COORD, AG-SUPV, AG-FIN, CG]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordForgotRequest'}
            example:
              email: maya.ortiz@example.com
      responses:
        '202':
          description: Request accepted.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
              example:
                message: If an account exists for that email, we have sent a reset link. It expires in 30 minutes.
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: |
        Sets a new password. The password must be at least 12 characters and is checked against a breached-password list;
        there is no forced periodic rotation (NIST SP 800-63B). All existing sessions are revoked.

        Requirements: FR-IAM-02. Business rules: BR-007.
      x-requirements: [FR-IAM-02]
      x-business-rules: [BR-007]
      x-permission: public:anonymous
      x-roles: [AG-ADM, AG-COORD, AG-SUPV, AG-FIN, CG]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
            example:
              token: pr_4Hn7Lakemont2Wq
              newPassword: river-maple-lantern-0419
      responses:
        '204':
          description: Password changed.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422':
          description: Business rule violation.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                token:
                  summary: IAM_RESET_TOKEN_INVALID
                  value:
                    type: https://api.tendwell.example/problems/IAM_RESET_TOKEN_INVALID
                    title: This reset link is no longer valid
                    status: 422
                    detail: Reset links work once and expire after 30 minutes. Request a new link.
                    instance: /v1/auth/password/reset
                    code: IAM_RESET_TOKEN_INVALID
                    requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
                policy:
                  summary: IAM_PASSWORD_POLICY_VIOLATION
                  value:
                    type: https://api.tendwell.example/problems/IAM_PASSWORD_POLICY_VIOLATION
                    title: Choose a stronger password
                    status: 422
                    detail: Use at least 12 characters. This password appears in a list of breached passwords.
                    instance: /v1/auth/password/reset
                    code: IAM_PASSWORD_POLICY_VIOLATION
                    requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
                    errors:
                    - pointer: /newPassword
                      code: BREACHED
                      message: Password found in a breach list.
                      ruleRef: BR-007
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /plans:
    get:
      tags: [Sign-up and subscription]
      operationId: listPlans
      summary: List plans available for sign-up
      description: |
        Returns active plans for the public sign-up site. Retired plans are not offered.

        Requirements: FR-ONB-01. Business rules: BR-002.
      x-requirements: [FR-ONB-01]
      x-business-rules: [BR-002]
      x-permission: public:anonymous
      x-roles: [AG-ADM]
      security: []
      responses:
        '200':
          description: Active plans.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlanList'}
              example:
                data:
                - id: 0d1e2f3a-4b5c-4d6e-8f7a-9b0c1d2e3f01
                  code: CARE-OPS-STD
                  name: Care Ops Standard
                  pricePerSeatCents: 1200
                  status: Active
                - id: 0d1e2f3a-4b5c-4d6e-8f7a-9b0c1d2e3f02
                  code: CARE-OPS-PLUS
                  name: Care Ops Plus
                  pricePerSeatCents: 1650
                  status: Active
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /promo-codes/validate:
    post:
      tags: [Sign-up and subscription]
      operationId: validatePromoCode
      summary: Validate a trial or promo code
      description: |
        Checks that a code exists, is active, has not expired, has redemptions left and is eligible for the selected plan,
        and returns its price effect before the agency submits. Validation does not consume a redemption.

        Requirements: FR-ONB-03. Business rules: BR-002, BR-004.
      x-requirements: [FR-ONB-03]
      x-business-rules: [BR-002, BR-004]
      x-permission: public:anonymous
      x-roles: [AG-ADM]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromoValidateRequest'}
            example:
              code: LAKEMONT21
              planId: 0d1e2f3a-4b5c-4d6e-8f7a-9b0c1d2e3f01
              seats: 180
      responses:
        '200':
          description: The code is valid; price effect included.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
            RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromoValidateResponse'}
              example:
                valid: true
                code: LAKEMONT21
                kind: Trial
                discountType: null
                value: null
                trialDays: 21
                priceEffect:
                  listPricePerSeatCents: 1200
                  effectivePricePerSeatCents: 1200
                  estimatedMonthlyCents: 216000
                  trialEndsOn: '2026-10-24'
                  firstChargeOn: '2026-10-24'
                  summary: 21-day free trial with no payment method required, then $12.00 per active client per month.
        '400': {$ref: '#/components/responses/BadRequest'}
        '422':
          description: Business rule violation.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              examples:
                expired:
                  summary: ONB_PROMO_CODE_EXPIRED
                  value:
                    type: https://api.tendwell.example/problems/ONB_PROMO_CODE_EXPIRED
                    title: This code has expired
                    status: 422
                    detail: The code LAKEMONT21 expired on 2026-09-30. Remove it or enter a different code.
                    instance: /v1/promo-codes/validate
                    code: ONB_PROMO_CODE_EXPIRED
                    requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
                notEligible:
                  summary: ONB_PROMO_CODE_NOT_ELIGIBLE
                  value:
                    type: https://api.tendwell.example/problems/ONB_PROMO_CODE_NOT_ELIGIBLE
                    title: This code does not apply to the selected plan
                    status: 422
                    detail: Choose an eligible plan or remove the code.
                    instance: /v1/promo-codes/validate
                    code: ONB_PROMO_CODE_NOT_ELIGIBLE
                    requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /signups:
    post:
      tags: [Sign-up and subscription]
      operationId: createSignup
      summary: Register a new agency
      description: |
        Creates a `Pending` tenant, the owner user and a `Trialing` or pending subscription, and sends a verification email
        (single-use link valid for 24 hours). The tenant is activated only after the email is verified. If the email is
        already registered, the response is the same and the email explains how to sign in instead.

        Requirements: FR-ONB-01, FR-ONB-02, FR-ONB-03. Business rules: BR-002, BR-004, BR-007.
      x-requirements: [FR-ONB-01, FR-ONB-02, FR-ONB-03]
