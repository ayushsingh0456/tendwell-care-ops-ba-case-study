      description: |
        Lists clients in the caller's assigned locations. Date of birth, Medicaid ID, phone, service address and diagnoses are
        masked. Filters never accept PHI values in the query string: search by name or date of birth is done client-side on
        the loaded page or through the duplicate check in `POST /clients`.

        Requirements: FR-CLI-01, FR-CLI-06, FR-IAM-06. Business rules: BR-011. Non-functional: NFR-PRIV-01.
