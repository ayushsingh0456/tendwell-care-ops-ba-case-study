    ComplianceSeverity:
      type: string
      enum: [HardBlock, Warning]
    ComplianceCheck:
      type: string
      description: Checks run on every visit create or edit (FR-SCH-03).
      enum:
      - CAREGIVER_OVERLAP
      - TRAVEL_BUFFER
      - BLOCKING_CREDENTIAL
      - CLIENT_EXCLUSION
      - AUTHORIZATION_COVERAGE
      - AUTHORIZATION_UNITS
      - TIME_OFF
    Weekday:
      type: string
      enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
    EditScope:
      type: string
      enum: [ThisOccurrence, ThisAndFollowing]
      description: FR-SCH-04. Series edits change only future, not-yet-started visits (BR-018).
    EventType:
      type: string
      enum:
      - visit.scheduled
      - visit.changed
      - visit.cancelled
      - visit.clocked_in
      - visit.clocked_out
      - visit.verified
      - visit.missed
