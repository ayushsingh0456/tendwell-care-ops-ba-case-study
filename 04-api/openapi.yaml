                instance: /v1/family/messages
                code: FAM_CONSENT_NOT_RECORDED
                requestId: 5e1d7a90-3c2b-4f8e-9a6d-0b1c2d3e4f5a
        '429': {$ref: '#/components/responses/TooManyRequests'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (JWT, 15-minute lifetime) issued by `POST /auth/login`, `POST /auth/mfa/verify`
        or `POST /auth/refresh`. Claims include `sub`, `tenant_id`, `roles`, `locations`, `amr`,
        `sid` and, for support access, `support_grant_id`. Permissions are evaluated server-side
        on every request (FR-IAM-06). See api-guidelines.md section 12.
    webhookSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: |
        Payment-provider signature header (`t=<unix time>,v1=<hex HMAC-SHA256>`). The signed payload is
        `<t>.<raw request body>` with the endpoint signing secret. Requests older than 5 minutes are rejected.
        See events-and-webhooks.md section 7.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `page.nextCursor` of the previous response. Omit for the first page.
      schema:
        type: string
        maxLength: 512
      example: eyJrIjoiMjAyNi0wOS0wOFQxMzowMDowMFoiLCJpIjoiYTFmM2M1ZTcifQ
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key (UUID recommended) that makes this POST safe to retry. The first response is stored
        for 24 hours and replayed for retries with the same key and body. The same key with a different body
        returns 422 `API_IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 6f1c2a9e-3d4b-4c5a-9e8f-7a6b5c4d3e21
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on this operation. Client-generated key (UUID recommended); responses are stored for 24 hours.
        The same key with a different body returns 422 `API_IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 2b7d9f13-5c8e-4a61-b0d2-9e4f3a2c1b70
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The `ETag` from the last read of the resource. A mismatch returns 412 `API_PRECONDITION_FAILED`;
        a missing header returns 428 `API_PRECONDITION_REQUIRED`.
      schema:
        type: string
      example: '"4"'
    From:
      name: from
      in: query
      required: false
      description: Inclusive start instant (RFC 3339, UTC).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Exclusive end instant (RFC 3339, UTC).
      schema:
        type: string
        format: date-time
    LocationIdQuery:
      name: locationId
      in: query
      required: false
      description: Filter to one location. Results are always limited to the caller's assigned locations.
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PromoCodeId:
      name: promoCodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SignupId:
      name: signupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CarePlanId:
      name: carePlanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaregiverId:
      name: caregiverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DoseTaskId:
      name: doseTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TimeOffRequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PeriodId:
      name: periodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventType:
      name: eventType
      in: path
      required: true
      description: Domain event type, for example `dose.missed`.
      schema: {$ref: '#/components/schemas/EventType'}
    ReportCode:
      name: reportCode
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ReportCode'}
  headers:
    X-Request-Id:
      description: Correlation ID for this request. Echoes the caller's value when supplied, otherwise generated. Quote it
        to support.
      schema:
        type: string
        format: uuid
    RateLimit-Limit:
      description: Requests allowed in the current window for this caller and route class.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    ETag:
      description: Version tag of the returned resource (strong). Send it in `If-Match` on the next update.
      schema:
        type: string
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    Idempotent-Replayed:
      description: '`true` when the response is a replay of the first response for the same Idempotency-Key.'
      schema:
        type: boolean
    Sunset:
      description: RFC 8594 date after which a deprecated operation stops working (at least 6 months after deprecation).
      schema:
        type: string
    Deprecation:
      description: Present on deprecated operations, with the date the deprecation was announced.
      schema:
        type: string
    X-Export-Watermark:
      description: Watermark embedded in the export (user, tenant, timestamp). FR-RPT-04, BR-058.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed or fails schema validation.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tendwell.example/problems/API_VALIDATION_FAILED
            title: The request has invalid fields
            status: 400
            detail: Fix the highlighted fields and try again.
            instance: /v1/visits
            code: API_VALIDATION_FAILED
            requestId: 0b9e7c4a-1d2f-4e3a-8b5c-6d7e8f9a0b1c
            errors:
            - pointer: /scheduledEnd
              code: MUST_BE_AFTER_START
              message: The end time must be later than the start time.
    Unauthorized:
      description: The access token is missing, expired or revoked.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tendwell.example/problems/IAM_UNAUTHENTICATED
            title: Sign-in required
            status: 401
            detail: Your session has ended. Sign in again to continue.
            instance: /v1/clients
            code: IAM_UNAUTHENTICATED
            requestId: 1c0f8d5b-2e3a-4f4b-9c6d-7e8f9a0b1c2d
    Forbidden:
      description: The caller lacks the permission, the record is outside the caller's location scope, MFA is required, or
        the tenant is read-only.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            permissionDenied:
              summary: Missing permission
              value:
                type: https://api.tendwell.example/problems/IAM_PERMISSION_DENIED
                title: You do not have access to this action
                status: 403
                detail: Your role does not allow this action. Ask your Agency Administrator if you need access.
                instance: /v1/invoices/b4e2d6f8-1a3c-4e5b-9d7f-000000000123/approve
                code: IAM_PERMISSION_DENIED
                requestId: 2d1a9e6c-3f4b-4a5c-8d7e-8f9a0b1c2d3e
            mfaRequired:
              summary: MFA required for this role (BR-006)
              value:
                type: https://api.tendwell.example/problems/IAM_MFA_REQUIRED
                title: Set up two-step verification to continue
                status: 403
                detail: Your role requires two-step verification. Set up an authenticator app or SMS code, then sign in again.
                instance: /v1/invoices
                code: IAM_MFA_REQUIRED
                requestId: 2d1a9e6c-3f4b-4a5c-8d7e-8f9a0b1c2d40
            tenantReadOnly:
              summary: Tenant is read-only (BR-003)
              value:
                type: https://api.tendwell.example/problems/TEN_READ_ONLY
                title: Your agency account is read-only
                status: 403
                detail: Your agency's trial has ended or a subscription payment is overdue, so you can view and export data
                  but not make changes. An administrator can add or update the payment method under Subscription. Clock-in
                  and clock-out still work.
                instance: /v1/visits
                code: TEN_READ_ONLY
                requestId: 3e2b0f7d-4a5c-4b6d-9e8f-9a0b1c2d3e4f
    NotFound:
      description: The resource does not exist or is not visible to the caller. Records of other tenants always return 404.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tendwell.example/problems/API_RESOURCE_NOT_FOUND
            title: Not found
            status: 404
            detail: We could not find that record. It may have been removed or you may not have access to it.
            instance: /v1/clients/5b2e8f14-6c3a-4d9b-a7e2-c10234000999
            code: API_RESOURCE_NOT_FOUND
            requestId: 4f3c1a8e-5b6d-4c7e-8f9a-0b1c2d3e4f5a
    Conflict:
      description: The resource is in a state that does not allow this action, or a request with the same Idempotency-Key
        is still in progress.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tendwell.example/problems/API_IDEMPOTENCY_REQUEST_IN_PROGRESS
            title: The original request is still being processed
            status: 409
            detail: A request with this Idempotency-Key is still in progress. Wait a few seconds and retry with the same key.
            instance: /v1/billing-runs
            code: API_IDEMPOTENCY_REQUEST_IN_PROGRESS
            requestId: 5a4d2b9f-6c7e-4d8f-9a0b-1c2d3e4f5a6b
    PreconditionFailed:
      description: The `If-Match` value does not match the current `ETag`. Someone else changed the record.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tendwell.example/problems/API_PRECONDITION_FAILED
            title: This record changed since you opened it
            status: 412
            detail: Someone else saved a change to this record. Reload it, review the changes and try again.
            instance: /v1/clients/5b2e8f14-6c3a-4d9b-a7e2-c10234000001
            code: API_PRECONDITION_FAILED
            requestId: 6b5e3c0a-7d8f-4e9a-8b1c-2d3e4f5a6b7c
    PreconditionRequired:
      description: The operation requires an `If-Match` header.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tendwell.example/problems/API_PRECONDITION_REQUIRED
            title: Version check required
            status: 428
            detail: Reload the record and try again.
            instance: /v1/visits/a1f3c5e7-0b2d-4c6e-8f1a-20260908a001
            code: API_PRECONDITION_REQUIRED
            requestId: 7c6f4d1b-8e9a-4f0b-9c2d-3e4f5a6b7c8d
    UnprocessableEntity:
      description: The request is well formed but breaks a business rule. `code` identifies the rule; see the error code catalog.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tendwell.example/problems/API_IDEMPOTENCY_KEY_REUSED
            title: This request key was already used for different data
            status: 422
            detail: The Idempotency-Key was used earlier with a different request body. Generate a new key for a new request.
            instance: /v1/billing-runs
            code: API_IDEMPOTENCY_KEY_REUSED
            requestId: 8d7a5e2c-9f0b-4a1c-8d3e-4f5a6b7c8d9e
    TooManyRequests:
      description: Rate limit exceeded for this caller and route class.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimit-Limit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimit-Reset'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: https://api.tendwell.example/problems/API_RATE_LIMITED
            title: Too many requests
            status: 429
            detail: You are sending requests too quickly. Wait 20 seconds and try again.
            instance: /v1/visits
            code: API_RATE_LIMITED
            requestId: 9e8b6f3d-0a1c-4b2d-9e4f-5a6b7c8d9e0f
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is the stable machine-readable error code from the catalog in api-guidelines.md.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: 'URI that identifies the problem type: https://api.tendwell.example/problems/{code}.'
        title:
          type: string
          description: Short, user-safe summary. Never contains client names, dates of birth, addresses, Medicaid IDs, diagnoses
            or medication names.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: User-safe explanation that states the problem and the fix (NFR-USE-03). Same PHI exclusions as title;
            times, counts and opaque record numbers are allowed. Problem bodies are not logged beyond code, status and requestId.
        instance:
          type: string
          format: uri-reference
          description: The request path. Contains opaque IDs only.
        code:
          type: string
          pattern: ^[A-Z]{3}_[A-Z0-9_]+$
          examples: [EVV_CLOCK_IN_WINDOW_NOT_OPEN]
        requestId:
          type: string
          format: uuid
        errors:
          type: array
          description: Field-level or rule-level details.
          items: {$ref: '#/components/schemas/ProblemError'}
    ProblemError:
      type: object
      required: [code, message]
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the offending request field.
        code:
          type: string
        message:
          type: string
        ruleRef:
          type: string
          description: Business rule or requirement ID, for example BR-016.
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    Address:
      type: object
      required: [line1, city, state, postalCode]
      properties:
        line1:
          type: string
          maxLength: 120
        line2:
          type: [string, 'null']
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          pattern: ^[A-Z]{2}$
        postalCode:
          type: string
          pattern: ^[0-9]{5}(-[0-9]{4})?$
    GeoFix:
      type: object
      required: [lat, lng]
      description: Device location fix. Coordinates (0,0) or accuracy worse than 100 m raise LOW_GPS_ACCURACY (BR-022).
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: [number, 'null']
          minimum: 0
          description: Horizontal accuracy reported by the device. Null when the OS gives none.
    Message:
      type: object
      properties:
        message:
          type: string
    RoleCode:
      type: string
      enum: [PLT-ADM, PLT-SUP, AG-ADM, AG-COORD, AG-SUPV, AG-FIN, CG, FAM]
    TenantStatus:
      type: string
      enum: [Pending, Trial, Active, ReadOnly, Cancelled]
    SubscriptionStatus:
      type: string
      enum: [Trialing, Active, PastDue, ReadOnly, Cancelled]
    PlanStatus:
      type: string
      enum: [Active, Retired]
    PromoKind:
      type: string
      enum: [Trial, Discount]
    DiscountType:
      type: string
      enum: [Percent, Fixed]
    UserStatus:
      type: string
      enum: [Invited, Active, Locked, Deactivated]
    OverrideEffect:
      type: string
      enum: [Grant, Deny]
    SupportGrantScope:
      type: string
      enum: [ReadOnly, ReadWrite]
    SupportGrantStatus:
      type: string
      enum: [Requested, Active, Expired, Revoked, Declined]
    ServiceLineCode:
      type: string
      enum: [HOME_VISIT, ADULT_DAY, SUPPORTED_LIVING]
    ClientStatus:
      type: string
      enum: [Active, OnHold, Discharged]
    PrefKind:
      type: string
      enum: [Preferred, Excluded]
    PayerType:
      type: string
      enum: [Medicaid, ManagedCare, LTCInsurance, PrivatePay, VA]
    BillingModel:
      type: string
      enum: [Hourly, PerVisit, Daily, FixedMonthly]
    UnitType:
      type: string
      enum: [Unit15Min, Visit, Day, Month]
    AuthorizationStatus:
      type: string
      enum: [Active, Expired, Suspended]
    CarePlanStatus:
      type: string
      enum: [Draft, PendingApproval, Active, Superseded]
    TaskCategory:
      type: string
      enum: [ADL, IADL, Clinical]
    EmploymentType:
      type: string
      enum: [FullTime, PartTime, PerDiem]
    CaregiverStatus:
      type: string
      enum: [Active, Inactive]
    CredentialStatus:
      type: string
      enum: [Valid, Expiring, Expired]
    PayType:
      type: string
      enum: [Hourly, Salaried]
    VisitStatus:
      type: string
      enum: [Scheduled, InProgress, Completed, NeedsReview, Verified, Cancelled, Missed]
    PunchType:
      type: string
      enum: [In, Out]
    PunchSource:
      type: string
      enum: [Mobile, MobileOffline, Manual, System]
    IdentityResult:
      type: string
      enum: [Pass, Fail]
    ExceptionCode:
      type: string
      enum:
      - LATE_START
      - EARLY_END
      - LOCATION_MISMATCH
      - LOW_GPS_ACCURACY
      - MISSING_CLOCK_OUT
      - UNSCHEDULED_VISIT
      - LATE_OFFLINE_SYNC
      - AUTO_CLOSED
      - IDENTITY_CHECK_FAILED
    ExceptionStatus:
      type: string
      enum: [Open, Resolved, Waived]
    TaskResultStatus:
      type: string
      enum: [Done, NotDone]
    MedicationOrderStatus:
      type: string
      enum: [PendingApproval, Active, Discontinued]
    DoseStatus:
      type: string
      enum: [Due, Overdue, Given, Refused, Held, NotAvailable, SelfAdministered, MissedUndocumented]
    DoseOutcome:
      type: string
      description: Outcomes a caregiver can record (FR-MAR-03). `SelfAdministered` means self-administered with supervision.
      enum: [Given, Refused, Held, NotAvailable, SelfAdministered]
    VitalType:
      type: string
      enum: [BP, PULSE, TEMP, SPO2, RESP, GLUCOSE, WEIGHT, PAIN]
    NoteStatus:
