      description: |
        Runs a standard report (EVV compliance, visit history, caregiver hours, authorization utilization, MAR compliance,
        incident log, AR ageing) with filters. `Accept: text/csv` or `application/pdf` returns an export; every export is
        watermarked with user, tenant and timestamp and recorded in the audit log. Date ranges are limited to 366 days.

