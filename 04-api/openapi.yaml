      summary: Claim an open shift
      description: |
        The first eligible claim wins. When the tenant enables Coordinator confirmation (CR-002), the result is
        `PendingConfirmation` and the visit stays an open shift until confirmed; otherwise the caregiver is assigned at once.
        A losing concurrent claim returns `409`.

        Requirements: FR-SCH-05. Business rules: BR-014, BR-016, BR-017, BR-039. Change requests: CR-002.
