            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EscalationLadder'}
              example:
                id: 8c9d0e1f-2a3b-4c4d-9e5f-6a7b8c9d0e09
                eventType: dose.missed
                steps:
                - delayMin: 0
                  recipientRole: AG-SUPV
                  channels: [Push, SMS]
                - delayMin: 30
                  recipientRole: AG-ADM
                  channels: [SMS, Email]
                updatedAt: '2026-09-24T16:00:00Z'
        '400': {$ref: '#/components/responses/BadRequest'}
